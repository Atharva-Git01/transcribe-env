[recipe]
id = "meeting_multi_speaker"
version = 7
description = "Three or more speakers on one channel: interviews, meetings, group conversations."
when_to_use = "speakers.estimate >= 3 (measured from phase 4)."
when_not_to_use = "One or two speakers on separate channels (true_stereo_call)."
stages = ["convert", "denoise", "vad", "lid", "diarize", "recognise", "verify", "polish", "gate", "export"]

[convert]
channels = "downmix"
highpass_hz = 80
loudnorm_target_lufs = -20.0
sample_rate = 16000

[denoise]
engine = "deep_filter"
fallback = ["ffmpeg_afftdn", "copy_through"]
skip_below_dbfs = -42.0
attenuation_limit_db = 12.0       # gentle: overlapping voices suffer from strong suppression
speech_guard = false              # TRIED 2026-10-23 and rejected: splicing the original back broke Whisper (CER 0.51 -> 0.92, E21)
speech_guard_threshold = 0.2
speech_guard_db = 12.0

[vad]
engine = "silero"
threshold = 0.40
min_speech_ms = 200
min_silence_ms = 300
speech_pad_ms = 200
max_segment_s = 20.0
gap_audit = true                  # re-check pauses that still hold speech-level sound (quiet speech, PLAN P4)
gap_threshold = 0.2
gap_min_s = 0.3
gap_energy_db = 15.0

[lid]
mode = "auto"
per_segment = true

[diarize]
mode = "embed_cluster"            # speaker embeddings on 1 s windows, clustered + smoothed (E19)
num_speakers = 0                  # 0 = estimate (marked "estimated" in the report)
max_speakers = 8
split_cosine = 0.68               # estimate: split while the halves are less similar than this (0.65-0.70 right on AMI 4->3, Pappa 2, 1 speaker; E19)
min_speaker_s = 5.0               # estimate: a speaker needs at least this much speech
window_s = 1.0
hop_s = 0.25
switch_penalty = 0.1              # smoothing: cost of changing speaker between neighbouring windows
min_turn_s = 0.3

[recognise]
language = "auto"
initial_prompt_file = "prompts/initial_prompts/{lang}/general.txt"
word_timestamps = true
segmentation = "vad_concat"        # "vad_concat" (speech joined into <= 30 s windows; best CER, E14) | "clips"
split_max_s = 10.0
recover_missed_turns = true       # a turn with speech but no words is decoded again on its own (PLAN P3)
recover_min_s = 0.3
recover_min_logprob = -0.8         # recovered text must be at least this confident (Whisper invents text on short clips)                # output segments longer than this are cut at word boundaries (text unchanged)
group_max_s = 20.0               # clips mode only: VAD regions merged into clips of at most this length
group_max_gap_s = 0.8             # clips mode only: regions closer than this are merged

[recognise.faster_whisper]
compute_type_gpu = "int8_float16"
compute_type_cpu = "int8"
beam_size = 5
best_of = 5
patience = 1.0
temperature = [0.0, 0.2, 0.4, 0.6]
compression_ratio_threshold = 2.4
log_prob_threshold = -1.0
no_speech_threshold = 0.6
condition_on_previous_text = false
repetition_penalty = 1.0
no_repeat_ngram_size = 0
hallucination_silence_threshold = 2.0

[recognise.indic_conformer]
decoder = "rnnt"                  # "rnnt" (Pappa CER 0.383) | "ctc" (0.390, gives word timings)
segmentation = "turns"            # RNNT has no word timings: decode each speaker turn on its own
piece_max_s = 20.0
threads = 8

[recognise.indic_transcribe]
segmentation = "turns"            # single-speaker model (model card): decode each speaker turn on its own
piece_max_s = 30.0                # the model was trained on clips of up to 30 s
threads = 8
dtype = "bfloat16"
device = "auto"                   # "auto" = GPU when it fits in memory, else CPU

[verify]
required = false

[polish]
doubled_words_guard = true

[gate]
thresholds = "gate"

[export]
formats = "defaults"
