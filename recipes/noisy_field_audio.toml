[recipe]
id = "noisy_field_audio"
version = 7
description = "CCTV, body-cam, street, vehicle or wind noise; low signal-to-noise."
when_to_use = "noise.snr_db_estimate < 12 dB."
when_not_to_use = "Clean recordings — denoising clean audio removes detail and can raise the error rate."
stages = ["convert", "separate", "denoise", "vad", "lid", "diarize", "recognise", "verify", "polish", "gate", "export"]

[convert]
channels = "downmix"
highpass_hz = 100
loudnorm_target_lufs = -20.0
sample_rate = 16000

[separate]
required = false                  # skipped only if Demucs is not installed
engine = "demucs"
model = "htdemucs"                # Hybrid Transformer Demucs v4 (MIT); the vocals stem is kept
shifts = 1                        # 1 = one pass (deterministic, seeded); more = slower, slightly cleaner
overlap = 0.25
apply_if_background_db_above = -15.0   # keep the original when music/TV is quieter than this vs the speech

[denoise]
engine = "deep_filter"
fallback = ["ffmpeg_afftdn", "copy_through"]
skip_below_dbfs = -45.0
attenuation_limit_db = 24.0
speech_guard = false              # TRIED 2026-10-23 and rejected: splicing the original back broke Whisper (CER 0.51 -> 0.92, E21)
speech_guard_threshold = 0.2
speech_guard_db = 12.0

[vad]
engine = "silero"
threshold = 0.30                  # soft speech under noise
min_speech_ms = 250
min_silence_ms = 500
speech_pad_ms = 300
max_segment_s = 25.0
gap_audit = true                  # re-check pauses that still hold speech-level sound (quiet speech, PLAN P4)
gap_threshold = 0.2
gap_min_s = 0.3
gap_energy_db = 15.0

[lid]
mode = "auto"
per_segment = false

[diarize]
mode = "embed_cluster"            # speaker embeddings on 1 s windows, clustered + smoothed (E19)
num_speakers = 0                  # 0 = estimate (marked "estimated" in the report)
max_speakers = 4
split_cosine = 0.6                # estimate: split a cluster while its halves are less similar than this
min_speaker_s = 5.0               # estimate: a speaker needs at least this much speech
window_s = 1.0
hop_s = 0.25
switch_penalty = 0.1              # smoothing: cost of changing speaker between neighbouring windows
min_turn_s = 0.3

[recognise]
language = "auto"
initial_prompt_file = "prompts/initial_prompts/{lang}/general.txt"
word_timestamps = true
segmentation = "vad_concat"        # "vad_concat" (speech joined into <= 30 s windows; best CER, E14) | "clips"
split_max_s = 10.0
recover_missed_turns = true       # a turn with speech but no words is decoded again on its own (PLAN P3)
recover_min_s = 0.3
recover_min_logprob = -0.8         # recovered text must be at least this confident (Whisper invents text on short clips)                # output segments longer than this are cut at word boundaries (text unchanged)
group_max_s = 20.0               # clips mode only: VAD regions merged into clips of at most this length
group_max_gap_s = 0.8             # clips mode only: regions closer than this are merged

[recognise.faster_whisper]
compute_type_gpu = "int8_float16"
compute_type_cpu = "int8"
beam_size = 5
best_of = 5
patience = 1.0
temperature = [0.0, 0.2, 0.4, 0.6]
compression_ratio_threshold = 2.2   # stricter: noise invites loops
log_prob_threshold = -1.0
no_speech_threshold = 0.5
condition_on_previous_text = false
repetition_penalty = 1.05
no_repeat_ngram_size = 0
hallucination_silence_threshold = 1.5

[verify]
required = false                  # runs only when config/defaults.toml [engines.cross_check].enabled = true

[polish]
doubled_words_guard = true

[gate]
thresholds = "gate"

[export]
formats = "defaults"
