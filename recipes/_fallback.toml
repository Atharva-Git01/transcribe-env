[recipe]
id = "_fallback"
version = 4
description = "Safe general settings when no specific rule matches."
when_to_use = "Only when every other rule in config/selection_rules.toml failed to match."
when_not_to_use = "Never force this recipe on audio that matches a specific rule."
stages = ["convert", "denoise", "vad", "lid", "diarize", "recognise", "verify", "polish", "gate", "export"]

[convert]
channels = "downmix"
highpass_hz = 80
loudnorm_target_lufs = -20.0
sample_rate = 16000

[denoise]
engine = "deep_filter"
fallback = ["ffmpeg_afftdn", "copy_through"]
skip_below_dbfs = -42.0
attenuation_limit_db = 15.0

[vad]
engine = "silero"
threshold = 0.40
min_speech_ms = 200
min_silence_ms = 400
speech_pad_ms = 250
max_segment_s = 28.0

[lid]
mode = "auto"
per_segment = false

[diarize]
mode = "embed_cluster"            # speaker embeddings on 1 s windows, clustered + smoothed (E19)
num_speakers = 0                  # 0 = estimate (marked "estimated" in the report)
max_speakers = 4
split_cosine = 0.6                # estimate: split a cluster while its halves are less similar than this
min_speaker_s = 5.0               # estimate: a speaker needs at least this much speech
window_s = 1.0
hop_s = 0.25
switch_penalty = 0.1              # smoothing: cost of changing speaker between neighbouring windows
min_turn_s = 0.3

[recognise]
language = "auto"
initial_prompt_file = "prompts/initial_prompts/{lang}/general.txt"
word_timestamps = true
segmentation = "vad_concat"        # "vad_concat" (speech joined into <= 30 s windows; best CER, E14) | "clips"
split_max_s = 10.0                # output segments longer than this are cut at word boundaries (text unchanged)
group_max_s = 20.0               # clips mode only: VAD regions merged into clips of at most this length
group_max_gap_s = 0.8             # clips mode only: regions closer than this are merged

[recognise.faster_whisper]
compute_type_gpu = "int8_float16"
compute_type_cpu = "int8"
beam_size = 5
best_of = 5
patience = 1.0
temperature = [0.0, 0.2, 0.4, 0.6]
compression_ratio_threshold = 2.4
log_prob_threshold = -1.0
no_speech_threshold = 0.6
condition_on_previous_text = false
repetition_penalty = 1.0
no_repeat_ngram_size = 0
hallucination_silence_threshold = 2.0

[verify]
required = false                  # runs only when config/defaults.toml [engines.cross_check].enabled = true

[polish]
doubled_words_guard = true

[gate]
thresholds = "gate"

[export]
formats = "defaults"
