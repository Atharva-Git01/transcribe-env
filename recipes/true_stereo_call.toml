[recipe]
id = "true_stereo_call"
version = 1
description = "Two genuinely different channels (e.g. call recorder with one party per channel)."
when_to_use = "channels.layout_class == true_stereo (correlation below 0.99 or level difference above 1 dB)."
when_not_to_use = "Duplicated mono (identical channels) — that is phone_call_mono."
stages = ["convert", "denoise", "vad", "lid", "diarize", "recognise", "polish", "gate", "export"]

[convert]
channels = "split"                # each channel processed on its own
highpass_hz = 80
loudnorm_target_lufs = -20.0
sample_rate = 16000

[denoise]
engine = "deep_filter"
fallback = ["noisereduce", "copy_through"]
skip_below_dbfs = -42.0
attenuation_limit_db = 18.0

[vad]
engine = "silero"
threshold = 0.40
min_speech_ms = 200
min_silence_ms = 400
speech_pad_ms = 250
max_segment_s = 28.0

[lid]
mode = "auto"
candidates = ["mr", "hi", "en"]
per_segment = false

[diarize]
mode = "channel"                  # channel 1 = SPK1, channel 2 = SPK2
crosstalk_suppression_db = 12.0   # a segment also present >12 dB quieter on the other channel is crosstalk

[recognise]
language = "auto"
initial_prompt_file = "prompts/initial_prompts/{lang}/phone_call.txt"
word_timestamps = true

[recognise.faster_whisper]
compute_type_gpu = "int8_float16"
compute_type_cpu = "int8"
beam_size = 5
best_of = 5
patience = 1.0
temperature = [0.0, 0.2, 0.4, 0.6]
compression_ratio_threshold = 2.4
log_prob_threshold = -1.0
no_speech_threshold = 0.6
condition_on_previous_text = false
repetition_penalty = 1.0
no_repeat_ngram_size = 0
hallucination_silence_threshold = 2.0
vad_filter = false

[recognise.indic_conformer]
decoder = "rnnt"

[polish]
doubled_words_guard = true
loop_action = "flag"
numerals = "defaults"

[gate]
thresholds = "gate"

[export]
formats = "defaults"
