[recipe]
id = "true_stereo_call"
version = 5
description = "Two genuinely different channels (e.g. call recorder with one party per channel)."
when_to_use = "channels.layout_class == true_stereo (correlation below 0.99 or level difference above 1 dB)."
when_not_to_use = "Duplicated mono (identical channels) — that is phone_call_mono."
stages = ["convert", "denoise", "vad", "lid", "diarize", "recognise", "verify", "polish", "gate", "export"]

[convert]
channels = "split"                # each channel processed on its own
highpass_hz = 80
loudnorm_target_lufs = -20.0
sample_rate = 16000

[denoise]
engine = "deep_filter"
fallback = ["ffmpeg_afftdn", "copy_through"]
skip_below_dbfs = -42.0
attenuation_limit_db = 18.0
speech_guard = false              # TRIED 2026-10-23 and rejected: splicing the original back broke Whisper (CER 0.51 -> 0.92, E21)
speech_guard_threshold = 0.2
speech_guard_db = 12.0

[vad]
engine = "silero"
threshold = 0.40
min_speech_ms = 200
min_silence_ms = 400
speech_pad_ms = 250
max_segment_s = 28.0
gap_audit = true                  # re-check pauses that still hold speech-level sound (quiet speech, PLAN P4)
gap_threshold = 0.2
gap_min_s = 0.3
gap_energy_db = 15.0

[lid]
mode = "auto"
per_segment = false

[diarize]
mode = "channel"                  # channel 1 = SPK1, channel 2 = SPK2
crosstalk_suppression_db = 12.0   # a segment also present >12 dB quieter on the other channel is crosstalk

[recognise]
language = "auto"
initial_prompt_file = "prompts/initial_prompts/{lang}/phone_call.txt"
word_timestamps = true
segmentation = "vad_concat"        # "vad_concat" (speech joined into <= 30 s windows; best CER, E14) | "clips"
split_max_s = 10.0
recover_missed_turns = true       # a turn with speech but no words is decoded again on its own (PLAN P3)
recover_min_s = 0.3
recover_min_logprob = -0.8         # recovered text must be at least this confident (Whisper invents text on short clips)                # output segments longer than this are cut at word boundaries (text unchanged)
group_max_s = 20.0               # clips mode only: VAD regions merged into clips of at most this length
group_max_gap_s = 0.8             # clips mode only: regions closer than this are merged

[recognise.faster_whisper]
compute_type_gpu = "int8_float16"
compute_type_cpu = "int8"
beam_size = 5
best_of = 5
patience = 1.0
temperature = [0.0, 0.2, 0.4, 0.6]
compression_ratio_threshold = 2.4
log_prob_threshold = -1.0
no_speech_threshold = 0.6
condition_on_previous_text = false
repetition_penalty = 1.0
no_repeat_ngram_size = 0
hallucination_silence_threshold = 2.0

[verify]
required = false                  # runs only when config/defaults.toml [engines.cross_check].enabled = true

[polish]
doubled_words_guard = true

[gate]
thresholds = "gate"

[export]
formats = "defaults"
