# The ONE place where a global default lives. Recipes may override stage params; nothing else may.
# Precedence (lowest -> highest): this file -> the selected recipe -> command-line overrides (recorded in plan.json).

[runtime]
min_free_gb = 2.0                 # refuse to start a run below this
analysis_sample_rate = 32000      # probe decodes at this rate (covers phone vs wideband vs fullband detection)
seed = 1234                       # fixed seed wherever a stage is stochastic
device = "auto"                   # "auto" (cuda if usable, else cpu) | "cpu". One GPU model at a time: load -> run -> unload (E06)

[fallback_ladder]                 # E04: speech heard but no text -> relax silence checks -> VAD off -> FAIL
min_speech_sec = 1.0
relaxed_no_speech_threshold = 0.9
relaxed_log_prob_threshold = -2.0

[output]
style = "verbatim"                # "verbatim" (forensic, default) | "readable"
formats = ["txt", "srt", "vtt", "json"]
review_tag = "[review]"           # appended to every flagged line; speakers are SPK1, SPK2 … or SPK? (unknown)

[languages]
priority = ["mr", "hi", "en"]          # also the LID candidate set; first entry = fallback if nothing is measured
lid_engines = ["faster_whisper_large_v3_turbo", "faster_whisper_large_v3", "faster_whisper_medium"]  # first installed
lid_windows = 6                        # probe: up to 6 windows spread over the speech
lid_window_sec = 30.0
code_switch_en_min = 0.20              # English mean prob >= this next to a strong Indic language = code-switch risk
# Step 2 of LID (E10): Whisper's acoustic LID almost never says "mr" for Marathi phone audio. For mr/hi the speech
# groups are decoded FORCED as mr and as hi: (a) mean log-prob gap >= margin decides; else (b) marker words
# (library/lid_markers/) that survive in the OTHER language's forced text decide; else acoustic. Then a weak result
# falls back to priority[0] with a language_ambiguous warning (gate -> REVIEW).
text_lid_ll_margin = 0.03              # forced-decode mean log-prob gap (mr vs hi) needed to decide on likelihood
text_lid_min_markers = 3               # fewer surviving distinct marker words than this -> no marker decision
text_lid_min_confidence = 0.65         # decision confidence below this -> priority[0] + language_ambiguous warning
code_switch_min_en_windows = 3         # Indic decision AND English top in >= this many LID windows -> code-switch high

# Engine per language: an ordered list, the FIRST INSTALLED one is used (large-v3 lives on the D: USB drive; when it
# is unplugged the run falls back to turbo and decisions.json says so). Chosen by `trx eval` (CHANGELOG 0.5.0):
# Pappa call (Marathi phone audio), seeded, vad_concat: large-v3 CER 0.531 · turbo 0.793; medium looped in Bengali
# letters (unseeded, CER 1.52). FMS on the same call, same metric: 0.745.
# en has no fixture yet: turbo first (fast; same family as large-v3).
[engines.primary]
mr = ["faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
hi = ["faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
en = ["faster_whisper_large_v3_turbo", "faster_whisper_large_v3"]
mixed = ["faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
unknown = ["faster_whisper_large_v3", "faster_whisper_large_v3_turbo", "faster_whisper_medium"]

[engines.cross_check]
enabled = false                   # second engine (different model) scores agreement per segment; off: see MORNING_REPORT.md
mr = ""
hi = ""
en = ""
mixed = ""
unknown = ""

[vocabulary]
# The FMS Marathi vocab maps some real words onto other words (see knowledge/ERRORS.md E07). Off until reviewed.
enabled = false
files = []

[llm_cleanup]
enabled = false                   # Phase 3: Gemma 3 via llama.cpp; suggestions only, 5 gates decide
model = "gemma3_4b_it_q4"
