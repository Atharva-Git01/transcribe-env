# The ONE place where a global default lives. Recipes may override stage params; nothing else may.
# Precedence (lowest -> highest): this file -> the selected recipe -> command-line overrides (recorded in plan.json).

[runtime]
min_free_gb = 2.0                 # refuse to start a run below this
analysis_sample_rate = 32000      # probe decodes at this rate (covers phone vs wideband vs fullband detection)
seed = 1234                       # fixed seed wherever a stage is stochastic
device = "auto"                   # "auto" (cuda if usable, else cpu) | "cpu". One GPU model at a time: load -> run -> unload (E06)

[runtime.memory_gb]
# Free memory (RAM + page file) an engine family needs to load and run; below it the run stops with MEMORY_LOW
# instead of crashing (E31). "<family>_gpu" applies when the engine runs on the GPU (E33).
indic_transcribe = 5.5            # CPU, float32: a whole run peaks at ~7.0 GB, loading adds ~5 GB
indic_transcribe_gpu = 3.0        # GPU, bf16 loaded straight to the GPU: the process holds ~2.7 GB
indic_conformer = 3.0             # CPU (onnxruntime)

[fallback_ladder]                 # E04: speech heard but no text -> relax silence checks -> VAD off -> FAIL
min_speech_sec = 1.0
relaxed_no_speech_threshold = 0.9
relaxed_log_prob_threshold = -2.0

[output]
style = "verbatim"                # "verbatim" (forensic, default) | "readable"
formats = ["txt", "srt", "vtt", "json"]
# Owner convention (2026-10-22): standard spelling, numbers as words, English words in Devanagari.
spelling = "standard"             # "standard": words the lexicon does not know are listed for the reviewer | "as_recognised"
numbers = "words"                 # "words": integers and % become words (library/numbers/<lang>.toml) | "as_recognised"
english_words = "devanagari"      # "devanagari": Latin-script words in mr/hi lines are listed for the reviewer | "as_recognised"
review_tag = "[review]"           # appended to every flagged line; speakers are SPK1, SPK2 … or SPK? (unknown)

[languages]
priority = ["mr", "hi", "en"]          # also the LID candidate set; first entry = fallback if nothing is measured
lid_engines = ["faster_whisper_large_v3_turbo", "faster_whisper_large_v3", "faster_whisper_medium"]  # first installed
lid_windows = 6                        # probe: up to 6 windows spread over the speech
lid_window_sec = 30.0
code_switch_en_min = 0.20              # English mean prob >= this next to a strong Indic language = code-switch risk
# Step 2 of LID (E10): Whisper's acoustic LID almost never says "mr" for Marathi phone audio. For mr/hi the speech
# groups are decoded FORCED as mr and as hi: (a) mean log-prob gap >= margin decides; else (b) marker words
# (library/lid_markers/) that survive in the OTHER language's forced text decide; else acoustic. Then a weak result
# falls back to priority[0] with a language_ambiguous warning (gate -> REVIEW).
text_lid_ll_margin = 0.03              # forced-decode mean log-prob gap (mr vs hi) needed to decide on likelihood
text_lid_min_markers = 3               # fewer surviving distinct marker words than this -> no marker decision
text_lid_min_confidence = 0.65         # decision confidence below this -> priority[0] + language_ambiguous warning
code_switch_min_en_windows = 3         # Indic decision AND English top in >= this many LID windows -> code-switch high
segment_en_min = 0.80                  # per-group LID: a group becomes English only if P(en) >= this (vs all others)

# Engine per language: an ordered list, the FIRST INSTALLED one is used (if a model folder is missing or damaged the
# run falls back to the next one and decisions.json says so). Chosen by `trx eval` (CHANGELOG 0.5.0):
# Pappa call (Marathi phone audio), seeded, vad_concat: large-v3 CER 0.531 · turbo 0.793; medium looped in Bengali
# letters (unseeded, CER 1.52). FMS on the same call, same metric: 0.745.
# en has no fixture yet: turbo first (fast; same family as large-v3).
[engines.primary]
# 0.7.0 (eval 2026-10-23, same pipeline, each speaker turn decoded on its own): Indic-Transcribe-core beats large-v3 on
# every fixture - CER Pappa 0.513 -> 0.379, FLEURS mr 0.273 -> 0.049, hi 0.072 -> 0.021, AMI (en) 0.308 -> 0.284.
# IndicConformer-600M is the first fallback for mr/hi (0.377 / 0.056 / 0.034; it has no English). Whisper stays as the
# last fallback and for language ID.
mr = ["indic_transcribe_core", "indic_conformer_600m", "faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
hi = ["indic_transcribe_core", "indic_conformer_600m", "faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
en = ["indic_transcribe_core", "faster_whisper_large_v3_turbo", "faster_whisper_large_v3"]
mixed = ["indic_transcribe_core", "faster_whisper_large_v3", "faster_whisper_large_v3_turbo"]
unknown = ["indic_transcribe_core", "faster_whisper_large_v3", "faster_whisper_large_v3_turbo", "faster_whisper_medium"]

[engines.cross_check]
enabled = false                   # second engine (different model) scores agreement per segment; off: see MORNING_REPORT.md
mr = ""
hi = ""
en = ""
mixed = ""
unknown = ""

[vocabulary]
# The FMS Marathi vocab maps some real words onto other words (see knowledge/ERRORS.md E07). Off until reviewed.
enabled = false
files = []

[llm_cleanup]
# ON since 2026-10-22 (owner rule: only after eval proves it). Gemma suggests; the word gate + language model keep
# only spelling/punctuation/Hindi->Marathi form fixes of heard words (E17). Eval, cleanup off -> on:
# Pappa CER 0.531 -> 0.513, FLEURS mr 0.286 -> 0.273, FLEURS hi 0.083 -> 0.074. Costs ~+1-2 min per file.
enabled = true
# Engine families whose output is cleaned. With Indic-Transcribe the cleanup changed nothing (eval 2026-10-23, off -> on:
# Pappa 0.379 -> 0.379, FLEURS mr 0.048 -> 0.049, hi 0.021 -> 0.021) and cost ~15 % of the run time (E26).
engines = ["faster_whisper"]
model = "gemma3_4b_it_q4"
