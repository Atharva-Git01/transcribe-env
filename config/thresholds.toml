# Every numeric threshold the pipeline uses. Provisional values are marked; `trx eval` tunes them (MAINTAINER.md).

[probe]
min_duration_sec = 0.5
frame_ms = 30
dup_mono_min_correlation = 0.99     # two channels this similar are one signal copied twice
dup_mono_max_level_diff_db = 1.0
narrowband_max_rolloff_hz = 3800    # 95 % energy rolloff below this = telephone band (300-3400 Hz)
wideband_max_rolloff_hz = 7500
activity_margin_db = 10.0           # frame counts as active if it is this far above the noise floor
activity_min_dbfs = -60.0
clip_level = 0.999
warn_clipping_ratio = 0.001
warn_low_snr_db = 10.0
warn_quiet_lufs = -35.0
warn_low_activity_ratio = 0.10
vad_threshold = 0.40                # probe-time Silero VAD (activity + in-speech SNR + LID windows)
gated_frame_below_peak_db = 60.0    # in-speech frames this far below the speech peak are codec gating, not noise
diarize_max_minutes = 15            # probe estimates the speaker count (sherpa-onnx) only for files up to this length
music_window_s = 10.0               # probe: Demucs looks at the 10 s with the most speech
music_background_db = -12.0         # probe: non-vocal energy above this (vs speech) = music/TV behind the voice

[verify]                            # Phase 2 (provisional)
min_agreement = 0.80                # engine-vs-engine character agreement per window
min_avg_logprob = -1.0
min_token_logprob_mean = -0.21      # Indic-Transcribe: mean log-prob of its chosen tokens; below = soft flag
                                    # 'uncertain' (E40: catches 57-83 % of the bad lines, clean speech 0 flags)
max_no_speech_prob = 0.60
max_compression_ratio = 2.4        # floor of the length-aware limit below (E37)
compression_base = 2.25             # limit = max(2.4, base + per_char * characters) + margin: no human-written
compression_per_char = 0.0016       #   Marathi/Hindi/English line reached it (231 pieces); real loops do
compression_margin = 0.35
repeat_share_max = 0.35             # 'repetitive' when >= 35 % of a line's word triples are repeats (natural max 18 %)
repeat_min_triples = 6
omission_min_speech_sec = 1.5       # VAD speech this long with no text = omission flag
lexicon_min_count = 3               # a word seen fewer times in the language's corpus (~60-80 M words) is "unknown"

[gate]                              # provisional until there are more fixtures (QUESTIONS.md Q10)
review_if_flagged_ratio_above = 0.05   # ANY flag on more than 5 % of transcribed time -> REVIEW
fail_if_flagged_ratio_above = 0.40     # HARD flags (not listed below) on more than 40 % -> FAIL
# Soft flags mark lines a reviewer should check, but the text is a real attempt at the speech (wrong word forms,
# speaker boundaries, channel bleed). They can make a run REVIEW, never FAIL. Matched by flag-name prefix.
soft_flags = ["hindi_forms_in_marathi", "speaker_change_inside_segment", "crosstalk", "recovered_turn", "quiet_speech",
              "uncertain", "meaning_check"]
# Info flags are shown in review_list.md to help the reviewer but never change the verdict.
info_flags = ["unknown_words", "latin_script"]
fail_if_no_text = true

[llm_cleanup]                       # gates for Gemma suggestions (pipeline/stages/cleanup.py, E17)
min_length_ratio = 0.50             # whole suggestion: shorter than half the heard text = over-deletion -> rejected
max_word_edit_ratio = 0.25          # word gate: a word may change at most 25 % of its letters (spelling fixes only)
