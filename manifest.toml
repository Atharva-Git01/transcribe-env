# Every component of the environment. Read by `trx doctor` (status) and pipeline/models.py (engine -> folder).
# Source URLs are used ONLY by setup/ after the owner's OK — never at runtime. Exact files + sha256: setup/sources.toml.
# phase: when it is installed. commercial_ok: yes | conditional | no. status: installed | not_installed | excluded.
# A model counts as installed only when <path>/<marker> AND <path>/SOURCE.json exist (SOURCE.json is written after
# the sha256 check, so a half-downloaded file never counts).

[environment]
name = "transcribe-env"
cost_rule = "zero cost: no paid API, plan or service; free licences that allow commercial use"
runtime_network = "none (offline guard); internet only in setup/ after the owner's OK"
machine = "i5-13420H 8C/12T, 16 GB RAM, RTX 3050 Laptop 4 GB, Windows 11"
storage_note = 'All models are on C: (moved back from the D: USB stick on 2026-10-16). D:\transcribe-env-models keeps a backup copy; nothing at runtime uses D:.'

# ---------------------------------------------------------------- phase 0 (skeleton)
[[component]]
id = "python312"
kind = "runtime"
phase = 0
status = "installed"
licence = "PSF"
commercial_ok = "yes"
note = "system Python 3.12.10 builds toolchain/python/.venv; bin/trx uses the venv when present"

[[component]]
id = "ffmpeg"
kind = "binary"
phase = 0
status = "installed"
licence = "LGPL/GPL (gyan.dev full build 8.0.1)"
commercial_ok = "yes"
note = "decode (pipeline/audio.decode_mono), resample, loudness (ebur128), highpass/loudnorm, afftdn denoise fallback"

[[component]]
id = "git"
kind = "binary"
phase = 0
status = "installed"
licence = "GPL-2.0"
commercial_ok = "yes"
note = "environment history + one repo per run"

# ---------------------------------------------------------------- phase 1 (bootstrap: venv, GPU, first engine)
[[component]]
id = "venv"
kind = "python"
phase = 1
status = "installed"
licence = "various permissive (MIT/BSD/Apache) — see setup/requirements.lock"
commercial_ok = "yes"
path = "toolchain/python/.venv"
note = "26 packages pinned with sha256 in setup/requirements.lock (faster-whisper 1.2.1, ctranslate2 4.8.3, onnxruntime 1.31.0, sherpa_onnx 1.13.8, numpy 2.5.4, av 19.0.1 …) + setup/requirements-nodeps.lock (nvidia-cudnn-cu12 9.27.0.42). No torch."

[[component]]
id = "cuda12_runtime"
kind = "binary"
phase = 1
status = "installed"
licence = "NVIDIA CUDA redistributable EULA"
commercial_ok = "yes"
path = "toolchain/bin/cuda12"
note = "cublas64_12 / cublasLt64_12 / cudart64_12 hard-linked from Ollama's lib/ollama/cuda_v12 (0 extra disk). cuDNN 9 comes from the nvidia-cudnn-cu12 wheel. pipeline/gpu.py adds both folders to the DLL search path."

[[component]]
id = "faster_whisper_medium"
kind = "model"
phase = 1
status = "installed"
licence = "MIT"
commercial_ok = "yes"
path = "toolchain/models/faster-whisper-medium"
marker = "model.bin"
source = "https://huggingface.co/Systran/faster-whisper-medium"
size_mb = 1534
note = "hard links to the Hugging Face cache snapshot (0 extra disk)"

[[component]]
id = "silero_vad"
kind = "bundled"
phase = 1
status = "installed"
licence = "MIT"
commercial_ok = "yes"
note = "the Silero VAD ONNX model shipped inside the faster-whisper wheel (faster_whisper/assets); used by probe + vad stage"

[[component]]
id = "deep_filter"
kind = "binary"
phase = 1
status = "installed"
licence = "MIT OR Apache-2.0"
commercial_ok = "yes"
path = "toolchain/bin/deep-filter"
source = "https://github.com/Rikorose/DeepFilterNet/releases/tag/v0.5.6"
note = "DeepFilterNet3 standalone deep-filter.exe (run with -D delay compensation); no torch"

# ---------------------------------------------------------------- phase 2 (engines)
[[component]]
id = "faster_whisper_large_v3_turbo"
kind = "model"
phase = 2
status = "installed"
licence = "MIT"
commercial_ok = "yes"
path = "toolchain/models/faster-whisper-large-v3-turbo"
marker = "model.bin"
source = "https://huggingface.co/dropbox-dash/faster-whisper-large-v3-turbo"
size_mb = 1622
note = "fast LID engine (lid_engines[0]); CTranslate2 conversion of openai/whisper-large-v3-turbo"

[[component]]
id = "faster_whisper_large_v3"
kind = "model"
phase = 2
status = "installed"
licence = "MIT"
commercial_ok = "yes"
path = "toolchain/models/faster-whisper-large-v3"
marker = "model.bin"
source = "https://huggingface.co/Systran/faster-whisper-large-v3"
size_mb = 3093
note = 'most accurate engine here (default for mr/hi); backup copy on D:\transcribe-env-models'

[[component]]
id = "indic_conformer_600m"
kind = "model"
phase = 2
status = "installed"
licence = "MIT"
commercial_ok = "yes"
path = "toolchain/models/indic-conformer-600m-multilingual"
marker = "assets/encoder.onnx"
source = "https://huggingface.co/ai4bharat/indic-conformer-600m-multilingual (revision 2a77d305)"
size_mb = 2560
note = "AI4Bharat Conformer, hybrid CTC + RNNT, 22 Indic languages (no English). onnxruntime CPU + TorchScript mel preprocessor (torch CPU). Gated (auto) - downloaded with the owner's HF login."

[[component]]
id = "indic_transcribe_core"
kind = "model"
phase = 2
status = "installed"
licence = "Indic Open Model License v1.0 (Bodhan AI / AI4Bharat); base nvidia/canary-1b-v2"
commercial_ok = "conditional"
path = "toolchain/models/indic-transcribe-core"
marker = "model.safetensors"
source = "https://huggingface.co/bodhan-ai/indic-transcribe-core (revision e083ab7d)"
size_mb = 4891
note = "Canary FastConformer+Transformer, 1.2B, 25+ languages incl. Indian English, code-mixed, native script. Self-hosting free; hosting for others needs Bodhan AI's written approval; credit 'Built with Indic-Transcribe-core from Bodhan AI / AI4Bharat'. CPU fp32 here (torch CPU build)."

[[component]]
id = "indicwhisper"
kind = "model"
phase = 99
status = "excluded"
licence = "not stated"
commercial_ok = "no"
note = "EXCLUDED until a licence is published (Vistaar, reported Marathi avg WER 18.2%)"

# ---------------------------------------------------------------- phase 3 (local LLM cleanup)
[[component]]
id = "llama_cpp_vulkan"
kind = "binary"
phase = 3
status = "installed"
licence = "MIT"
commercial_ok = "yes"
path = "toolchain/bin/llama.cpp"
source = "https://github.com/ggml-org/llama.cpp/releases/tag/b11669"
note = "llama-server.exe, Vulkan build b11669: uses the GPU without CUDA libs; started per run on 127.0.0.1, no service, no updater"

[[component]]
id = "gemma3_4b_it_q4"
kind = "model"
phase = 3
status = "installed"
licence = "Gemma Terms of Use"
commercial_ok = "conditional"
path = "toolchain/models/gemma-3-4b-it-q4"
marker = "gemma-3-4b-it-Q4_K_M.gguf"
source = "https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF"
size_mb = 2374
note = "owner's choice (Gemma 3). Ungated ggml-org GGUF, Q4_K_M. Commercial use allowed under the Gemma prohibited-use policy."

# ---------------------------------------------------------------- phase 4 (hard audio)
[[component]]
id = "sherpa_diarization"
kind = "model"
phase = 4
status = "installed"
licence = "MIT (pyannote segmentation 3.0) + Apache-2.0 (WeSpeaker ResNet34)"
commercial_ok = "yes"
path = "toolchain/models/sherpa-diarization"
marker = "wespeaker_en_voxceleb_resnet34_LM.onnx"
source = "https://github.com/k2-fsa/sherpa-onnx/releases"
size_mb = 33
note = "run by the sherpa_onnx Python package from the venv (no torch, no account)"

[[component]]
id = "demucs_htdemucs"
kind = "model"
phase = 4
status = "installed"
licence = "MIT (Demucs v4, Meta)"
commercial_ok = "yes"
path = "toolchain/models/demucs-htdemucs"
marker = "htdemucs.yaml"
source = "https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th"
size_mb = 84
note = "music/TV separation (separate stage, probe music check); runs on CPU with the venv's PyTorch 2.14 (setup/requirements-ml.lock)"

[[component]]
id = "speaker_eres2netv2"
kind = "model"
phase = 4
status = "installed"
licence = "Apache-2.0 (3D-Speaker)"
commercial_ok = "yes"
path = "toolchain/models/speaker-eres2netv2"
marker = "3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx"
source = "https://github.com/k2-fsa/sherpa-onnx/releases/tag/speaker-recongition-models"
size_mb = 68
note = "speaker embeddings for diarization mode embed_cluster (E19): 94.5 % of words on the right speaker on the Pappa call"

# ---------------------------------------------------------------- phase 6 (language model correction)
[[component]]
id = "lm_mr_v1"
kind = "model"
phase = 6
status = "installed"
licence = "CC-0 (built from IndicCorp v2, AI4Bharat)"
commercial_ok = "yes"
path = "toolchain/models/lm-mr-v1"
marker = "meta.json"
source = "https://huggingface.co/datasets/ai4bharat/IndicCorpV2 (data/mr.txt, first 1 GiB)"
size_mb = 125
note = "Marathi word trigram model + lexicon (657k word forms) built by setup/build_lm.py; scores how Marathi a line reads"

[[component]]
id = "lm_hi_v1"
kind = "model"
phase = 6
status = "installed"
licence = "CC-0 (built from IndicCorp v2, AI4Bharat)"
commercial_ok = "yes"
path = "toolchain/models/lm-hi-v1"
marker = "meta.json"
source = "https://huggingface.co/datasets/ai4bharat/IndicCorpV2 (data/hi-1.txt, first 1 GiB)"
